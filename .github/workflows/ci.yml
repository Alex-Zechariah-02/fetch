# Checks the Fetch programs, their vulnerability status and the shop on every
# change. The gateway comes from APIWard at the commit go.mod pins.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref, the newest wins: an older run of the same ref tells nothing the newer one will not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    # Every job has a time limit, so a hung test, download or deployment frees its runner.
    timeout-minutes: 45
    env:
      EAT_PORT_OFFSET: "1000"
    defaults:
      run:
        working-directory: fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fetch/go.mod
          cache-dependency-path: fetch/go.sum
      # The APIWard commit is the one go.mod names (checked by go.sum): the
      # hash a pseudo-version ends with, or a release tag. Module proxy
      # metadata is not trusted for it.
      - id: pin
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/Alex-Zechariah-02/apiward)
          if [[ $version =~ [.-][0-9]{14}-([0-9a-f]{12})$ ]]; then
            echo "ref=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/apiward
          path: apiward
          fetch-depth: 0
          persist-credentials: false
      # An abbreviated or ambiguous hash fails here rather than checking out
      # another commit.
      - env:
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          commit=$(git -C "$GITHUB_WORKSPACE/apiward" rev-parse --verify --end-of-options "$REF^{commit}")
          git -C "$GITHUB_WORKSPACE/apiward" checkout --quiet --detach "$commit"
      - run: go mod verify
      # pipefail stops the step when git or gofmt fails; every file name reaches gofmt intact.
      - shell: bash
        run: |
          git ls-files -z '*.go' | xargs -0 -r gofmt -l > "$RUNNER_TEMP/unformatted.txt"
          if [ -s "$RUNNER_TEMP/unformatted.txt" ]; then cat "$RUNNER_TEMP/unformatted.txt"; exit 1; fi
      - run: go vet ./...
      - run: go test ./... -count=1
      # The test binary's own limit ends a deadlock with a goroutine dump before the job limit cuts it off.
      - run: go test -race ./... -count=1 -timeout 30m

  vuln:
    runs-on: ubuntu-24.04
    # A stalled module download or vulnerability scan is cancelled, freeing the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only, never pushed: the image must build and carry its commit.
      - run: docker build --build-arg "REVISION=$GITHUB_SHA" --tag fetch:ci .
      - run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' fetch:ci)" = "$GITHUB_SHA"

  lint:
    runs-on: ubuntu-24.04
    # A stalled linter download or scan is cancelled, freeing the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Correctness checks beyond go vet (settings: staticcheck.conf).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  client:
    # The browser tests run one at a time against one stack per spec file, so
    # two machines share the files, balanced by their recorded run times; the
    # checks that need run only once go with the first.
    name: client (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    # A wedged browser test or a stalled package download is cancelled, freeing the runner.
    timeout-minutes: 30
    env:
      EAT_PORT_OFFSET: "3000"
      SHARD: ${{ matrix.shard }}
      # The second shard runs every spec file not listed here, so a new file
      # always runs.
      SHARD1_FILES: e2e/orders.spec.ts e2e/staff.spec.ts e2e/dev.spec.ts e2e/environment.spec.ts
    defaults:
      run:
        working-directory: fetch/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fetch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fetch/go.mod
          cache-dependency-path: fetch/go.sum
      # The browser tests build the gateway and its Dashboard from APIWard.
      # The APIWard commit is the one go.mod names (checked by go.sum): the
      # hash a pseudo-version ends with, or a release tag. Module proxy
      # metadata is not trusted for it.
      - id: pin
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/Alex-Zechariah-02/apiward)
          if [[ $version =~ [.-][0-9]{14}-([0-9a-f]{12})$ ]]; then
            echo "ref=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alex-Zechariah-02/apiward
          path: apiward
          fetch-depth: 0
          persist-credentials: false
      # An abbreviated or ambiguous hash fails here rather than checking out
      # another commit.
      - env:
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          commit=$(git -C "$GITHUB_WORKSPACE/apiward" rev-parse --verify --end-of-options "$REF^{commit}")
          git -C "$GITHUB_WORKSPACE/apiward" checkout --quiet --detach "$commit"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same release as the image build stage.
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: |
            fetch/client/package-lock.json
            apiward/dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # high: a high or critical advisory fails the job; lower ones go with the routine updates.
      # audit.mjs lists each allowed advisory with its reason and end.
      - if: matrix.shard == 1
        run: npm audit --json | node audit.mjs high
      # The tests run in the runner image's Chrome (playwright.config.ts).
      # Failure traces hold page contents and test credentials, so they stay
      # on the machine that ran the tests and are not uploaded.
      # Files are found by Playwright's own default pattern, nested folders
      # too, so no test file falls outside every shard; a shard that selects
      # nothing fails, since Playwright given no file would run them all.
      - run: |
          files=()
          mapfile -t found < <(find e2e -type f -regextype posix-extended -regex '.*\.(spec|test)\.[cm]?[jt]sx?' | sort)
          for file in "${found[@]}"; do
            case " $SHARD1_FILES " in *" $file "*) listed=1 ;; *) listed=2 ;; esac
            if [ "$listed" = "$SHARD" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then echo "shard $SHARD selected no test file" >&2; exit 1; fi
          npx playwright test "${files[@]}"

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # A stalled dependency review is cancelled, freeing the runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Development dependencies build the shipped shop.
          fail-on-scopes: runtime, development, unknown
