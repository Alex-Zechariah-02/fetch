components:
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Merchants, categories, items and stock of the Fetch shop.
  title: Fetch Inventory API
  version: "1"
openapi: 3.1.0
paths:
  /inventory/categories:
    get:
      operationId: categories
      security: []
      x-fetch-access: allow
  /inventory/items/{rest}:
    get:
      operationId: item
      parameters:
        - description: The item ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security: []
      x-fetch-access: allow
    patch:
      operationId: item.update
      parameters:
        - description: The item ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                available:
                  type: boolean
                price_sen:
                  # The handler refuses a price below 50 or above 100000 sen with 422 invalid_change.
                  maximum: 100000
                  minimum: 50
                  type: integer
              # Either field alone is enough; the handler refuses an empty patch and unknown members.
              required: []
              type: object
        required: true
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
  /inventory/merchants:
    get:
      operationId: merchants
      parameters:
        - description: Only merchants of this section.
          in: query
          name: section
          required: false
          schema:
            enum:
              - food
              - mart
            type: string
        - description: A category ID from /inventory/categories.
          in: query
          name: category
          required: false
          schema:
            type: string
        - description: Most merchants on a page.
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - description: The last merchant ID of the previous page.
          in: query
          name: after
          required: false
          schema:
            type: string
      security: []
      x-fetch-access: allow
  /inventory/merchants/{rest}:
    get:
      operationId: merchant
      parameters:
        - description: The merchant ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security: []
      x-fetch-access: allow
  /inventory/search:
    get:
      operationId: search
      parameters:
        - description: Text to find in item names, descriptions and merchant names.
          in: query
          name: q
          required: true
          schema:
            maxLength: 40
            minLength: 2
            type: string
        - description: Only items of this section.
          in: query
          name: section
          required: false
          schema:
            enum:
              - food
              - mart
            type: string
      security: []
      x-fetch-access: allow
  /inventory/stock/{rest}:
    get:
      operationId: stock.read
      parameters:
        - description: The item ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
        - OPERATIONS
    patch:
      operationId: stock.adjust
      parameters:
        - description: The item ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                delta:
                  description: The stock change; zero is refused (422 invalid_change).
                  # The handler refuses a delta below -100 or above 100 with 422 invalid_change.
                  maximum: 100
                  minimum: -100
                  type: integer
              required:
                - delta
              type: object
        required: true
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
        - OPERATIONS
