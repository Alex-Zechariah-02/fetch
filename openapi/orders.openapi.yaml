components:
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Checkout, order lists, the order lifecycle and the wallet of the Fetch shop.
  title: Fetch Orders API
  version: "1"
openapi: 3.1.0
paths:
  /orders:
    get:
      operationId: all
      parameters:
        - description: Only orders with this status.
          in: query
          name: status
          required: false
          schema:
            enum:
              - placed
              - accepted
              - ready
              - picked_up
              - delivered
              - cancelled
            type: string
        - description: Most orders on a page.
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - description: The last order ID of the previous page.
          in: query
          name: after
          required: false
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - OPERATIONS
        - SUPPORT
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                address:
                  additionalProperties: false
                  properties:
                    city:
                      # The checkout handler refuses a city outside 1 to 40 characters.
                      maxLength: 40
                      minLength: 1
                      type: string
                    line1:
                      # The checkout handler refuses a first line outside 1 to 100 characters.
                      maxLength: 100
                      minLength: 1
                      type: string
                    line2:
                      # The checkout handler refuses a second line outside 0 to 100 characters.
                      maxLength: 100
                      minLength: 0
                      type: string
                    postcode:
                      # The checkout handler refuses a postcode that is not exactly 5 characters.
                      maxLength: 5
                      minLength: 5
                      type: string
                    state:
                      enum:
                        - Johor
                        - Kedah
                        - Kelantan
                        - Melaka
                        - Negeri Sembilan
                        - Pahang
                        - Perak
                        - Perlis
                        - Pulau Pinang
                        - Sabah
                        - Sarawak
                        - Selangor
                        - Terengganu
                        - Wilayah Persekutuan Kuala Lumpur
                        - Wilayah Persekutuan Labuan
                        - Wilayah Persekutuan Putrajaya
                      type: string
                  # Line1, postcode, city and state are required; the checkout handler refuses any other state.
                  required:
                    - line1
                    - postcode
                    - city
                    - state
                  type: object
                items:
                  items:
                    additionalProperties: false
                    properties:
                      item:
                        # The checkout handler refuses an item identifier that is not 7 characters.
                        maxLength: 7
                        minLength: 7
                        type: string
                      quantity:
                        # The checkout handler refuses a quantity outside 1 to 50.
                        maximum: 50
                        minimum: 1
                        type: integer
                    required:
                      - item
                      - quantity
                    type: object
                  # The checkout handler refuses an order with fewer than 1 or more than 20 lines.
                  maxItems: 20
                  minItems: 1
                  type: array
                merchant:
                  # The checkout handler refuses a merchant identifier that is not 7 characters.
                  maxLength: 7
                  minLength: 7
                  type: string
                note:
                  # The checkout handler refuses a note longer than 200 characters.
                  maxLength: 200
                  minLength: 0
                  type: string
                payment:
                  enum:
                    - cash
                    - wallet
                  type: string
              # The checkout handler refuses a payment other than cash or wallet.
              # These four members are required; the checkout handler refuses any other member name.
              required:
                - merchant
                - items
                - address
                - payment
              type: object
        required: true
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
  /orders/accept/{rest}:
    post:
      operationId: accept
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
  /orders/cancel/{rest}:
    post:
      operationId: cancel
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
  /orders/deliver/{rest}:
    post:
      operationId: deliver
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - RIDER
  /orders/detail/{rest}:
    get:
      operationId: detail
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
        - MERCHANT
        - OPERATIONS
        - RIDER
        - SUPPORT
  /orders/jobs:
    get:
      operationId: jobs
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - RIDER
  /orders/merchant:
    get:
      operationId: merchant
      parameters:
        - description: Only orders with this status.
          in: query
          name: status
          required: false
          schema:
            enum:
              - placed
              - accepted
              - ready
              - picked_up
              - delivered
              - cancelled
            type: string
        - description: Most orders on a page.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - description: The last order ID of the previous page.
          in: query
          name: after
          required: false
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
  /orders/mine:
    get:
      operationId: mine
      parameters:
        - description: Most orders on a page.
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - description: The last order ID of the previous page.
          in: query
          name: after
          required: false
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
  /orders/pickup/{rest}:
    post:
      operationId: pickup
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - RIDER
  /orders/quote:
    get:
      operationId: quote
      parameters:
        - description: The merchant ID to quote delivery from.
          in: query
          name: merchant
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
  /orders/ready/{rest}:
    post:
      operationId: ready
      parameters:
        - description: The order ID.
          in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - MERCHANT
  /orders/wallet:
    get:
      operationId: wallet
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
