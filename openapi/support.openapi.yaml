components:
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Fetch Support API
  version: "1"
openapi: 3.1.0
paths:
  /support/mine:
    get:
      operationId: mine
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
  /support/queue:
    get:
      operationId: queue
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - SUPPORT
  /support/reply/{rest}:
    post:
      operationId: reply
      parameters:
        - in: path
          name: rest
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                message:
                  maxLength: 2000
                  minLength: 1
                  type: string
              required:
                - message
              type: object
        required: true
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
        - SUPPORT
  /support/resolve/{rest}:
    post:
      operationId: resolve
      parameters:
        - in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - SUPPORT
  /support/ticket/{rest}:
    get:
      operationId: ticket
      parameters:
        - in: path
          name: rest
          required: true
          schema:
            type: string
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
        - SUPPORT
  /support/tickets:
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                message:
                  maxLength: 2000
                  minLength: 1
                  type: string
                order:
                  maxLength: 8
                  minLength: 8
                  type: string
                request_ref:
                  maxLength: 64
                  minLength: 16
                  type: string
                subject:
                  maxLength: 120
                  minLength: 5
                  type: string
              required:
                - subject
                - message
              type: object
        required: true
      security:
        - bearer: []
      x-fetch-access: allow
      x-fetch-roles:
        - CUSTOMER
